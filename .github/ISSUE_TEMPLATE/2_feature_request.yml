name: "🚀 Feature request"
description: Propose an improvement for this project.
labels: ["needs triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Please confirm this feature is not already requested in existing issues.

  - type: checkboxes
    id: requirements
    attributes:
      label: Have you checked for duplicates?
      options:
        - label: I searched existing issues and did not find the same request.
          required: true

  - type: textarea
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: What change do you want?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Optional alternatives you considered.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Links, screenshots, or extra details.
    validations:
      required: false
