name: "🐛 Report a bug"
description: Report a reproducible problem.
labels: ["needs triage", "bug"]
body:
  - type: markdown
    attributes:
      value: >
        Please confirm this is a bug report. For usage questions, check this repository's README first.

  - type: checkboxes
    id: requirements
    attributes:
      label: Have you checked for duplicates?
      options:
        - label: I searched existing issues and did not find the same bug.
          required: true

  - type: input
    attributes:
      label: Bug summary
      placeholder: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs or error messages
      placeholder: Paste relevant logs/errors.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Local development
        - CI workflow
        - Deployed site
    validations:
      required: true
