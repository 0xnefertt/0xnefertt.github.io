name: Check for broken links on site

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/broken-links-site.yml"
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json

      - name: Install dependencies 💾
        run: |
          npm ci
          npm --prefix astro ci
          npm --prefix writer ci

      - name: Validate and build site ✅
        run: |
          npm run verify:content
          npm run verify:build

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --root-dir '${{ github.workspace }}/astro/dist' --verbose --no-progress 'astro/dist/**/*.html'
