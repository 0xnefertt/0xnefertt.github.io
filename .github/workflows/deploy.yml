name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "astro/**"
      - "writer/**"
      - "shared/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "scripts/**"
      - ".prettierrc"
      - ".prettierignore"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_books/**"
      - "_data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "astro/**"
      - "writer/**"
      - "shared/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "scripts/**"
      - ".prettierrc"
      - ".prettierignore"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_books/**"
      - "_data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_writer:
        description: "Deploy the Worker API and apply D1 migrations before the site"
        type: boolean
        default: true

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    outputs:
      writer_changed: ${{ steps.changes.outputs.writer_changed }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json
            writer/package-lock.json

      - name: Install dependencies 💾
        run: |
          npm ci
          npm --prefix astro ci
          npm --prefix writer ci

      - name: Detect Worker changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_WRITER: ${{ inputs.deploy_writer }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "writer_changed=$DEPLOY_WRITER" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
              echo "writer_changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet "$BEFORE_SHA" HEAD -- writer shared _data/site-defaults.json .github/workflows/deploy.yml; then
              echo "writer_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "writer_changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "writer_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and build site ✅
        env:
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_ADSENSE_PUBLISHER_ID }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_WRITER_URL: ${{ vars.PUBLIC_WRITER_URL }}
        run: npm run verify

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Check browser flows and accessibility
        run: npm run test:browser

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-site
          path: astro/dist
          include-hidden-files: true

  deploy-writer:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.writer_changed == 'true'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: writer/package-lock.json
      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Set the CLOUDFLARE_API_TOKEN repository secret for the writer's Cloudflare account. Site deployment is blocked to avoid an API/UI version mismatch." >&2
            exit 1
          fi
      - run: npm --prefix writer ci
      - run: npm --prefix writer run db:remote
      - run: npm run writer:deploy

  deploy:
    permissions:
      contents: write
    needs: [verify, deploy-writer]
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && (needs.deploy-writer.result == 'success' || needs.deploy-writer.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-site
          path: astro/dist
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: astro/dist
