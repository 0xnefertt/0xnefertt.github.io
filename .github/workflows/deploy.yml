name: Deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_writer:
        description: "Deploy the Worker API and apply D1 migrations before the site"
        type: boolean
        default: true

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      writer_changed: ${{ steps.changes.outputs.writer_changed }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select checks for the changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_WRITER: ${{ inputs.deploy_writer }}
        run: python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json
            writer/package-lock.json

      - run: npm ci --no-audit
      - name: Check formatting
        if: steps.changes.outputs.mode == 'format'
        run: npm run format:check

      # Astro also bundles the admin UI from writer/src.
      - name: Install site and writer dependencies
        if: steps.changes.outputs.mode != 'format'
        run: |
          npm --prefix astro ci --no-audit
          npm --prefix writer ci --no-audit

      - name: Validate and build site
        if: steps.changes.outputs.mode != 'format'
        env:
          MODE: ${{ steps.changes.outputs.mode }}
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_ADSENSE_PUBLISHER_ID }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_WRITER_URL: ${{ vars.PUBLIC_WRITER_URL }}
        run: |
          if [[ "$MODE" == "settings" ]]; then
            npx --no-install prettier --check _data/site-settings.json
            npm run verify:build
          else
            npm run verify
          fi

      - name: Check internal links in the built site
        if: steps.changes.outputs.mode != 'format'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --root-dir '${{ github.workspace }}/astro/dist' --no-progress 'astro/dist/**/*.html'

      - name: Install browser test runtime
        if: steps.changes.outputs.mode == 'full'
        run: npx playwright install --with-deps chromium

      - name: Check browser flows and accessibility
        if: steps.changes.outputs.mode == 'full'
        run: npm run test:browser

      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.changes.outputs.mode == 'full'
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Record the verified source revision for the next deployment
        if: github.event_name != 'pull_request' && steps.changes.outputs.mode != 'format'
        run: git rev-parse HEAD > astro/dist/.deployment-revision

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' && steps.changes.outputs.mode != 'format'
        with:
          name: verified-site
          path: astro/dist
          include-hidden-files: true

  deploy-writer:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.writer_changed == 'true'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: writer/package-lock.json
      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Set the CLOUDFLARE_API_TOKEN repository secret for the writer's Cloudflare account. Site deployment is blocked to avoid an API/UI version mismatch." >&2
            exit 1
          fi
      - run: npm --prefix writer ci
      - run: npm --prefix writer run db:remote
      - run: npm run writer:deploy

  deploy:
    permissions:
      contents: write
    needs: [verify, deploy-writer]
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.verify.outputs.mode != 'format' && (needs.deploy-writer.result == 'success' || needs.deploy-writer.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-site
          path: astro/dist
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: astro/dist
