name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "astro/**"
      - "assets/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_news/**"
      - "_books/**"
      - "_data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "astro/**"
      - "assets/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_news/**"
      - "_books/**"
      - "_data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json

      - name: Install dependencies 💾
        run: |
          npm ci
          npm --prefix astro ci

      - name: Build Astro site 🔧
        run: npm run astro:build

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: astro/dist
