name: Weekly content health

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  content-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json
            writer/package-lock.json

      - name: Install dependencies 💾
        run: |
          npm ci
          npm --prefix astro ci
          npm --prefix writer ci

      - name: Run content health report 🧪
        id: content_check
        continue-on-error: true
        run: npm run report:content

      - name: Upload content report 📄
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: content-health-report
          path: reports/content-check.md
          retention-days: 14
          if-no-files-found: warn

      - name: Validate build output 🔧
        if: steps.content_check.outcome == 'success'
        run: npm run verify:build

      - name: Fail workflow when content check fails 🚨
        if: steps.content_check.outcome == 'failure'
        run: |
          echo "Content health check failed. See content-health-report artifact." >&2
          exit 1
