name: Check writing space

on:
  pull_request:
    paths:
      - "writer/**"
      - "shared/**"
      - "astro/**"
      - "_data/**"
      - "_pages/**"
      - "package.json"
      - ".github/workflows/writer-checks.yml"
  push:
    branches: [main, master]
    paths:
      - "writer/**"
      - "shared/**"
      - "astro/**"
      - "_data/**"
      - "_pages/**"
      - "package.json"
      - ".github/workflows/writer-checks.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: writer/package-lock.json
      - run: npm --prefix writer ci
      - run: npm run writer:check
      - run: npm run writer:test
      - run: npm run writer:build
